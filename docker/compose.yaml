name: yuqa

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yuqa}
      POSTGRES_USER: ${POSTGRES_USER:-yuqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    image: ${YUQA_IMAGE:-yuqa:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    env_file:
      - ../.env
    environment:
      DATABASE_URL: >-
        postgresql+psycopg2://${POSTGRES_USER:-yuqa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yuqa}
      YUQA_AUTO_MIGRATE: "true"
      YUQA_DATA_DIR: /data
      YUQA_LOG_FORMAT: ${YUQA_LOG_FORMAT:-json}
      YUQA_LOG_LEVEL: ${YUQA_LOG_LEVEL:-INFO}
    volumes:
      - yuqa-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "src.infrastructure.sqlalchemy.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres-data:
  yuqa-data:
