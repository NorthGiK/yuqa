name: yuqa

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yuqa}
      POSTGRES_USER: ${POSTGRES_USER:-yuqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    image: ${YUQA_IMAGE:-yuqa:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: >-
        postgresql+psycopg2://${POSTGRES_USER:-yuqa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yuqa}
      YUQA_AUTO_MIGRATE: "true"
      YUQA_DATA_DIR: /data
    volumes:
      - yuqa-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "src.infrastructure.sqlalchemy.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres-data:
  yuqa-data:
